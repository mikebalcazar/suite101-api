# Publica la puerta de las empresas (puerta/): el Worker que recibe lo que
# entra con el dominio de una empresa (quell.acme.com) y lo pasa a la app.
# Ver DOMINIOS.md, «La puerta publicada».
#
# El orden importa y por eso es un flujo aparte del de la API:
#   1. Se pone en la zona una ruta SIN Worker para `*taller101.com/*`. Con
#      ella, la ruta comodín `*/*` de la puerta sólo recibe lo de las
#      empresas: las apps de taller101.com no pasan nunca por la puerta.
#   2. Sólo entonces se publica la puerta.
#   3. Se mide que lo nuestro sigue contestando igual.
# 12-oct-2026 · también en suite101.app: ahí la ruta sin Worker va por cada
# dirección nuestra (la raíz, www y cada dominio propio de un Worker, leídos
# de Cloudflare), porque empresa.suite101.app SÍ va a la puerta.
# Si el token no alcanza la zona, se detiene en el paso 1 y no publica nada.
# Lo medido se deja como comentario del commit (OPERAR.md §6).

name: Publicar la puerta de las empresas

on:
  push:
    branches: [main]
    paths:
      - 'puerta/**'
      - '.github/workflows/puerta.yml'
  workflow_dispatch:

concurrency:
  group: despliegue-puerta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  puerta:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Lo nuestro se queda fuera de la puerta
        id: fuera
        run: |
          set -uo pipefail
          exec > >(tee -a /tmp/salida.txt) 2>&1
          echo "== 1. Rutas sin Worker para lo nuestro =="
          API=https://api.cloudflare.com/client/v4
          AUT="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # Una ruta corre ANTES que el dominio propio de un Worker: cada
          # direccion nuestra lleva su ruta sin Worker para no pasar por la puerta.
          poner() { # zona_id patron
            if echo "$RUTAS" | jq -e --arg p "$2" '.result[] | select(.pattern == $p)' >/dev/null; then echo "  ya estaba: $2"; return 0; fi
            r=$(curl -sS -X POST -H "$AUT" -H 'Content-Type: application/json' "$API/zones/$1/workers/routes" -d "$(jq -nc --arg p "$2" '{pattern: $p}')")
            if ! echo "$r" | jq -e '.success' >/dev/null; then echo "  No se pudo crear $2: $(echo "$r" | jq -c '.errors')"; return 1; fi
            echo "  creada (sin Worker): $2"
          }
          for ZONA in taller101.com suite101.app; do
            echo "-- $ZONA"
            zona=$(curl -sS -H "$AUT" "$API/zones?name=$ZONA" | jq -r '.result[0].id // empty')
            if [ -z "$zona" ]; then echo "SIN PERMISO: el token no puede leer la zona $ZONA. La puerta NO se publico."; exit 1; fi
            RUTAS=$(curl -sS -H "$AUT" "$API/zones/$zona/workers/routes")
            if ! echo "$RUTAS" | jq -e '.success' >/dev/null; then echo "SIN PERMISO para las rutas de Workers de $ZONA. La puerta NO se publico."; exit 1; fi
            if [ "$ZONA" = taller101.com ]; then
              poner "$zona" "*taller101.com/*" || exit 1
            else
              # suite101.app: la raiz, www y cada dominio propio de un Worker.
              # Lo demas (empresa.suite101.app) si va a la puerta.
              doms=$(curl -sS -H "$AUT" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?zone_name=$ZONA")
              if ! echo "$doms" | jq -e '.success' >/dev/null; then echo "SIN PERMISO para leer los dominios de Workers: $(echo "$doms" | jq -c '.errors'). La puerta NO se publico."; exit 1; fi
              for h in "$ZONA" "www.$ZONA" $(echo "$doms" | jq -r '.result[].hostname' | sort -u); do
                poner "$zona" "$h/*" || exit 1
              done
            fi
          done

      - name: Publicar la puerta
        run: |
          set -uo pipefail
          exec > >(tee -a /tmp/salida.txt) 2>&1
          echo "== 2. Publicar suite101-puerta =="
          npx wrangler deploy -c puerta/wrangler.toml

      - name: Medir que lo nuestro sigue igual
        run: |
          set -uo pipefail
          exec > >(tee -a /tmp/salida.txt) 2>&1
          echo "== 3. Lo nuestro, despues de publicar =="
          mal=0
          for u in https://api.suite101.app/salud https://app.suite101.app/ https://quell.suite101.app/ https://dash.suite101.app/ https://quote.suite101.app/ https://cost.suite101.app/ https://bill.suite101.app/ https://patron.suite101.app/ https://roster.suite101.app/ https://workshop.suite101.app/ https://peek.suite101.app/ https://supply.suite101.app/ https://suite101.app/ https://api.taller101.com/salud https://suite101.taller101.com/ https://quell101.taller101.com/ https://dash101.taller101.com/ https://quote101.taller101.com/ https://roster101.taller101.com/ https://workshop101.taller101.com/ https://peek101.taller101.com/ https://supply101.taller101.com/ https://cost101.taller101.com/ https://bill101.taller101.com/ https://patron101.taller101.com/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u")
            echo "  $c  $u"
            case "$c" in 5*|000) mal=1 ;; esac
          done
          for ZONA in taller101.com suite101.app; do
            zona=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$ZONA" | jq -r '.result[0].id // empty')
            echo "rutas de $ZONA ahora:"
            curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zona/workers/routes" | jq -r '.result[] | "  \(.pattern)  ->  \(.script // "(sin Worker)")"'
          done
          if [ "$mal" = 1 ]; then echo "RESULTADO: algo nuestro contesta 5xx"; exit 1; fi
          echo "RESULTADO: lo nuestro contesta igual"

      - name: Dejar lo medido en el commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          [ -f /tmp/salida.txt ] || echo "No hubo salida que reportar." > /tmp/salida.txt
          jq -Rs '{body: ("**Puerta de las empresas**\n\n```\n" + .[-60000:] + "\n```")}' /tmp/salida.txt > /tmp/comentario.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @/tmp/comentario.json -o /tmp/respuesta.json -w 'comentario: %{http_code}\n'
