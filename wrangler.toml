# suite101-api — el Worker. Una puerta, un D1 «master» y un Durable Object con
# SQLite por empresa.
#
# El identificador de la base D1 y el bucket de R2 NO se escriben a mano aquí:
# el flujo de publicación los crea si no existen y sustituye PENDIENTE por el
# identificador real antes de llamar a wrangler. La razon es que el chat que
# escribe este archivo no alcanza api.cloudflare.com y no puede saber ese
# identificador; el corredor de GitHub si.

name = "suite101-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "MASTER"
database_name = "suite101-master"
database_id = "PENDIENTE"
migrations_dir = "migrations/d1"

[[durable_objects.bindings]]
name = "ORG"
class_name = "OrgDB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrgDB"]

[[r2_buckets]]
binding = "ARCHIVOS"
bucket_name = "suite101"

# Las migraciones del OrgDB se importan como texto: el Durable Object las
# aplica al despertar y a runtime no hay disco del que leerlas.
[[rules]]
type = "Text"
globs = ["migrations/org/*.sql", "src/importar/*.html"]
fallthrough = true

[vars]
ENTORNO = "produccion"
API_VERSION = "0.13.0"
CORREO_REMITENTE = "Suite 101 <acceso@envios.taller101.mx>"
CORREO_SUPERADMIN = "mike@forespot.com"
# Origenes con permiso de CORS. La cookie va con SameSite=None, asi que aqui no
# puede haber un comodin: el navegador tira la respuesta si se contesta * con
# credenciales.
# Los orígenes a los que se les manda el boleto de Google (volver_a) y que
# reciben CORS. Cada app como Worker va aquí con su dominio.
ORIGENES = "https://conta-master.netlify.app,https://cuenta-taller101.netlify.app,https://cotizador-t101.netlify.app,https://t101-portal.mike-929.workers.dev,https://bitacora-obra.mike-929.workers.dev,https://dash101.mike-929.workers.dev,https://peek101.mike-929.workers.dev,https://master101.mike-929.workers.dev,https://quote101.mike-929.workers.dev,https://supervisor-t101.mike-929.workers.dev,https://workshop101.mike-929.workers.dev,http://localhost:5173"
# El origen público de esta API: es a donde Google devuelve (ver auth.ts).
URL_PUBLICA = "https://suite101-api.mike-929.workers.dev"

# ─────────────── staging ───────────────
# Mismo codigo, otra base y otro bucket. Aqui ENTORNO no es "produccion", asi
# que /auth/codigo devuelve el codigo en la respuesta y la prueba de humo puede
# entrar sola, sin buzon de correo. En produccion eso nunca pasa, y la propia
# prueba lo comprueba.
[env.staging]
name = "suite101-api-staging"

[env.staging.observability]
enabled = true

[[env.staging.d1_databases]]
binding = "MASTER"
database_name = "suite101-master-staging"
database_id = "PENDIENTE"
migrations_dir = "migrations/d1"

[[env.staging.durable_objects.bindings]]
name = "ORG"
class_name = "OrgDB"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["OrgDB"]

[[env.staging.r2_buckets]]
binding = "ARCHIVOS"
bucket_name = "suite101-staging"

[[env.staging.rules]]
type = "Text"
globs = ["migrations/org/*.sql", "src/importar/*.html"]
fallthrough = true

[env.staging.vars]
ENTORNO = "staging"
API_VERSION = "0.13.0"
CORREO_REMITENTE = "Suite 101 <acceso@envios.taller101.mx>"
CORREO_SUPERADMIN = "mike@forespot.com"
ORIGENES = "*"
URL_PUBLICA = "https://suite101-api-staging.mike-929.workers.dev"
