# suite101-api — el Worker. Una puerta, un D1 «master» y un Durable Object con
# SQLite por empresa.
#
# El identificador de la base D1 y el bucket de R2 NO se escriben a mano aquí:
# el flujo de publicación los crea si no existen y sustituye PENDIENTE por el
# identificador real antes de llamar a wrangler. La razon es que el chat que
# escribe este archivo no alcanza api.cloudflare.com y no puede saber ese
# identificador; el corredor de GitHub si.

name = "suite101-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Desde el 25-sep-2026 la API vive también en api.taller101.com, colgada del
# dominio como *custom domain* (Cloudflare pone el registro y el
# certificado). `workers_dev = true` es obligatorio al lado de `routes`: sin
# él wrangler apaga workers.dev, y de ahí dependen las apps de escritorio, la
# dirección de regreso de Google (URL_PUBLICA) y los flujos que leen la liga
# de la salida de wrangler. Staging no se cuelga del dominio (`routes = []`,
# porque `routes` se hereda).
workers_dev = true
routes = [
  { pattern = "api.taller101.com", custom_domain = true },
  # La puerta de la suite (2-oct-2026): la misma API sirve en este dominio la
  # página con las ligas a cada programa (src/portal.ts). Cloudflare pone el
  # registro y el certificado igual que para api.
  { pattern = "suite101.taller101.com", custom_domain = true },
  # 11-oct-2026 · suite101.app es la marca del producto (Mike: «taller101 será
  # una marca de FORESPOT»). Las dos de arriba siguen vivas mientras todo se
  # muda; éstas son las que se quedan.
  { pattern = "api.suite101.app", custom_domain = true },
  { pattern = "app.suite101.app", custom_domain = true },
  # Los programas de escritorio no tienen pantalla web: su dirección lleva a
  # su ficha en el sitio (Mike, 11-oct, con botones). Ver src/portal.ts.
  { pattern = "draw.suite101.app", custom_domain = true },
  { pattern = "nest.suite101.app", custom_domain = true },
  { pattern = "shape.suite101.app", custom_domain = true }
]

[observability]
enabled = true

[[d1_databases]]
binding = "MASTER"
database_name = "suite101-master"
database_id = "PENDIENTE"
migrations_dir = "migrations/d1"

[[durable_objects.bindings]]
name = "ORG"
class_name = "OrgDB"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrgDB"]

[[r2_buckets]]
binding = "ARCHIVOS"
bucket_name = "suite101"

# Las migraciones del OrgDB se importan como texto: el Durable Object las
# aplica al despertar y a runtime no hay disco del que leerlas.
[[rules]]
type = "Text"
globs = ["migrations/org/*.sql", "src/importar/*.html", "src/paginas/*.html", "**/paginas/icono/*.svg"]
fallthrough = true

# 8-oct-2026 · las letras de la puerta de la suite viajan dentro del Worker
# (el glob va con **/: con la ruta completa wrangler no lo aplicaba al publicar):
# nada se le pide a Google (regla de la casa).
[[rules]]
type = "Data"
globs = ["**/*.woff2", "**/paginas/icono/*.png", "**/paginas/icono/*.ico", "**/marca/*.ttf", "**/marca/*.png"]
fallthrough = true

[vars]
ENTORNO = "produccion"
API_VERSION = "0.21.0"
CORREO_REMITENTE = "Suite 101 <acceso@envios.taller101.mx>"
CORREO_SUPERADMIN = "mike@forespot.com"
# A donde se pide dejar de recibir AVISOS (la bienvenida, el estado de una
# orden). Va en la cabecera List-Unsubscribe. Mike la dio el 20-sep: es un
# buzon que alguien lee, y por eso se puede poner. Una salida que nadie
# procesa es una promesa falsa en una cabecera, y de esas vive la carpeta de
# basura.
#
# NO sale en el correo del codigo de acceso, y eso lo decide el codigo, no
# esta variable: darle "darse de baja" a tu propio codigo de entrada es
# ofrecerle a alguien que se deje fuera de su cuenta.
CORREO_BAJA = "info@forespot.com"
# Origenes con permiso de CORS. La cookie va con SameSite=None, asi que aqui no
# puede haber un comodin: el navegador tira la respuesta si se contesta * con
# credenciales.
# Los orígenes a los que se les manda el boleto de Google (volver_a) y que
# reciben CORS. Cada app como Worker va aquí con su dominio.
# Los tres sitios de Netlify (conta-master, cuenta-taller101, cotizador-t101)
# salieron el 24-sep: Netlify se retiró de la suite. Un sitio borrado en
# Netlify deja su nombre libre para cualquiera; si siguiera en esta lista, ese
# alguien tendría CORS con la cookie de sesión y recibiría boletos de Google.
# Desde el 25-sep toda la suite vive también en *.taller101.com (DNS en
# Cloudflare, Mike lo movió ese día); las dos direcciones de cada app
# —workers.dev y taller101.com— siguen vivas. quell101 es el Worker
# bitacora-obra y roster101 el Worker t101-portal: el dominio lleva el
# nombre de la app, no el del Worker.
# 11-oct-2026 · y en suite101.app, sin el «101» (quell.suite101.app): ahí se
# muda toda la suite. Las de taller101.com se quitan cuando ya manden aquí.
ORIGENES = "https://t101-portal.mike-929.workers.dev,https://bitacora-obra.mike-929.workers.dev,https://dash101.mike-929.workers.dev,https://peek101.mike-929.workers.dev,https://master101.mike-929.workers.dev,https://quote101.mike-929.workers.dev,https://workshop101.mike-929.workers.dev,https://supply101.mike-929.workers.dev,https://quote101.taller101.com,https://dash101.taller101.com,https://peek101.taller101.com,https://quell101.taller101.com,https://roster101.taller101.com,https://master101.taller101.com,https://workshop101.taller101.com,https://supply101.taller101.com,https://cost101.taller101.com,https://cost101.mike-929.workers.dev,https://patron101.taller101.com,https://investor101.taller101.com,https://investor101.mike-929.workers.dev,https://bill101.taller101.com,https://bill101.mike-929.workers.dev,https://dash.suite101.app,https://quell.suite101.app,https://quote.suite101.app,https://cost.suite101.app,https://patron.suite101.app,https://bill.suite101.app,https://supply.suite101.app,https://roster.suite101.app,https://peek.suite101.app,https://workshop.suite101.app,https://master.suite101.app,https://app.suite101.app,https://suite101.app,http://localhost:5173,https://taller101.com"
# El origen público de esta API: es a donde Google devuelve (ver auth.ts).
URL_PUBLICA = "https://suite101-api.mike-929.workers.dev"
# Desde el 25-sep-2026 workshop101 vive en su dominio propio; la de
# workers.dev sigue viva, pero manda para allá. Los correos llevan la buena.
URL_PANEL_DIRECTOR = "https://workshop.suite101.app"
# supply101, a donde manda el correo de «orden pagada» (29-sep-2026: antes
# apuntaba a esta API y salía `sin_sesion`).
URL_SUPPLY = "https://supply.suite101.app"
# patron101 (nació como investor101 el 8-oct-2026; Mike le cambió el nombre ese
# día): a donde mandan los correos de rondas, ofertas y pagos. La variable y el
# Worker conservan el nombre interno.
URL_INVESTOR = "https://patron.suite101.app"
CORREO_QUELL = "quell101 <bitacora@envios.taller101.mx>"
CORREO_ROSTER = "roster101 <expedientes@envios.taller101.mx>"
# El dominio propio de cada empresa (DOMINIOS.md): la zona de Cloudflare for
# SaaS y el registro de respaldo al que cada empresa apunta sus CNAME. El token
# (CLOUDFLARE_SAAS_TOKEN) es secreto y lo pone el despliegue.
# 12-oct-2026 · se mudan a suite101.app (Mike: «los dominios deben ser
# controlados por suite101.app»). Los nombres que nacieron en taller101.com
# los muda .github/workflows/mudar-dominios.yml.
ZONA_SAAS = "suite101.app"
RESPALDO_SAAS = "empresas.suite101.app"

# ─────────────── staging ───────────────
# Mismo codigo, otra base y otro bucket. Aqui ENTORNO no es "produccion", asi
# que /auth/codigo devuelve el codigo en la respuesta y la prueba de humo puede
# entrar sola, sin buzon de correo. En produccion eso nunca pasa, y la propia
# prueba lo comprueba.
[env.staging]
name = "suite101-api-staging"
routes = []

[env.staging.observability]
enabled = true

# 16-oct-2026 · Se probó correr staging junto al D1 (placement en
# aws:us-west-2, quedó en SEA) y se midió: una consulta al D1 tarda ~50 ms
# desde cualquier lado (/salud dice `d1_ms`), y con la sesión y la empresa ya
# juntadas en un viaje (0.103.1) quedan pocas consultas por pedido. Mandar el
# pedido a SEA sólo sumaba el salto: /salud, mediana 120 ms sin colocación
# contra 240 ms con ella. Se quitó; la API corre junto a quien pregunta.

[[env.staging.d1_databases]]
binding = "MASTER"
database_name = "suite101-master-staging"
database_id = "PENDIENTE"
migrations_dir = "migrations/d1"

[[env.staging.durable_objects.bindings]]
name = "ORG"
class_name = "OrgDB"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["OrgDB"]

[[env.staging.r2_buckets]]
binding = "ARCHIVOS"
bucket_name = "suite101-staging"

[[env.staging.rules]]
type = "Text"
globs = ["migrations/org/*.sql", "src/importar/*.html", "src/paginas/*.html", "**/paginas/icono/*.svg"]
fallthrough = true

# 8-oct-2026 · las letras de la puerta de la suite viajan dentro del Worker
# (el glob va con **/: con la ruta completa wrangler no lo aplicaba al publicar):
# nada se le pide a Google (regla de la casa).
[[env.staging.rules]]
type = "Data"
globs = ["**/*.woff2", "**/paginas/icono/*.png", "**/paginas/icono/*.ico", "**/marca/*.ttf", "**/marca/*.png"]
fallthrough = true

[env.staging.vars]
ENTORNO = "staging"
API_VERSION = "0.21.0"
CORREO_REMITENTE = "Suite 101 <acceso@envios.taller101.mx>"
CORREO_SUPERADMIN = "mike@forespot.com"
# La misma de produccion: en staging el correo no sale (salvo con
# CORREO_DE_VERDAD=1), pero si algun dia se prende a mano, que salga bien.
CORREO_BAJA = "info@forespot.com"
ORIGENES = "*"
URL_PUBLICA = "https://suite101-api-staging.mike-929.workers.dev"
URL_PANEL_DIRECTOR = "https://workshop101-staging.mike-929.workers.dev"
URL_SUPPLY = "https://supply101-staging.mike-929.workers.dev"
URL_INVESTOR = "https://investor101-staging.mike-929.workers.dev"
CORREO_QUELL = "quell101 <bitacora@envios.taller101.mx>"
CORREO_ROSTER = "roster101 <expedientes@envios.taller101.mx>"
# El dominio propio de cada empresa (DOMINIOS.md): la zona de Cloudflare for
# SaaS y el registro de respaldo al que cada empresa apunta sus CNAME. El token
# (CLOUDFLARE_SAAS_TOKEN) es secreto y lo pone el despliegue.
# 12-oct-2026 · se mudan a suite101.app (Mike: «los dominios deben ser
# controlados por suite101.app»). Los nombres que nacieron en taller101.com
# los muda .github/workflows/mudar-dominios.yml.
ZONA_SAAS = "suite101.app"
RESPALDO_SAAS = "empresas.suite101.app"
